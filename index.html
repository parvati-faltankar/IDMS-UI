<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#eb6a2c" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/excellon-icon.svg" />
    <title>Excellon</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <script>
      (function () {
        try {
          var appearance = window.localStorage.getItem('app-theme-mode');
          document.documentElement.dataset.theme = 'excellon';
          document.documentElement.dataset.appearance = appearance === 'dark' ? 'dark' : 'light';
          document.documentElement.style.colorScheme = appearance === 'dark' ? 'dark' : 'light';
        } catch (error) {
          document.documentElement.dataset.theme = 'excellon';
          document.documentElement.dataset.appearance = 'light';
          document.documentElement.style.colorScheme = 'light';
        }
      })();
    </script>
    <style>
      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
      }
      #root {
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
